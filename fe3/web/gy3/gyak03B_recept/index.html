<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Csápos borsó</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="danger">Veszély!!!</div>

    <h1>Csápos borsó</h1>

    <img class="food-img" src="csaposborso.jpg" alt="Csipős borsó">

    <div class="ingredients">
        <div class="ingredient">
            <img src="borso.jpg" alt="Borsó">
            <p>30 dkg borsó</p>
        </div>

        <div class="ingredient">
            <img src="paprika.jpg" alt="Tündér paprika">
            <p>3 db tündér paprika (egészben)</p>
        </div>

        <div class="ingredient">
            <img src="kolosszusrog.jpg" alt="Kolosszusrög">
            <p>4 szál extraerős kanyargó kolosszusrög</p>
        </div>
    </div>
</body>
</html>
