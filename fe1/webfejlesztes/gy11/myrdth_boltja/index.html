<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myrdth boltja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Myrdth boltja</h1>

    <video src="promo_video.mp4" autoplay muted controls></video>

    <h2>Termékeim</h2>

    <section class="shop">
        <div class="item">
            <img src="leleklampas.png" alt="Léleklámpás">
            <h3>Léleklámpás</h3>
            <p>Megvilágítja a rejtett igazságot</p>
        </div>
        <div class="item">
            <img src="portaltoll.png" alt="Portáltoll">
            <h3>Portáltoll</h3>
            <p>Egyetlen mozdulattal kaput nyit térben és időben</p>
        </div>
        <div class="item">
            <img src="alkimiaiko.png" alt="Alkímiai kő">
            <h3>Alkímiai kő</h3>
            <p>Mindent arannyá változtat. Elméletben</p>
        </div>
        <div class="item">
            <img src="alompergamen.png" alt="Álompergamen">
            <h3>Álompergamen</h3>
            <p>Feljegyzi a legmélyebb álmaidat</p>
        </div>
        <div class="item featured">
            <img src="idokristaly.png" alt="Időkristály">
            <h3>Időkristály</h3>
            <p>Megállítja az időt – vagy csak nagyon lelassítja</p>
        </div>
    </section>
</body>
</html>
